<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Vault System</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    text-align: center;
}

/* Title */
h1 {
    margin-bottom: 30px;
}

/* Buttons */
.btn {
    display: block;
    width: 250px;
    margin: 10px auto;
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

/* Write */
.write {
    background: #22c55e;
}

.write:hover {
    background: #16a34a;
}

/* Read */
.read {
    background: #3b82f6;
}

.read:hover {
    background: #2563eb;
}

/* Footer */
.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #94a3b8;
}
</style>

</head>

<body>

<div class="container">

    <h1>💻 Code Vault System</h1>

    <button class="btn write" onclick="openWrite()">
        ✍️ Open Write Panel
    </button>

    <button class="btn read" onclick="openRead()">
        📖 Open Read Panel
    </button>

    <div class="footer">
        Secure • Fast • Firebase Powered 🚀
    </div>

</div>

<script>
function openWrite() {
    window.location.href = "write.html";
}

function openRead() {
    window.location.href = "read.html";
}
</script>

</body>
</html>
