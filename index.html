<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes Viewer</title>

<!-- ✅ PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7f3f">

<style>

body{
  font-family:sans-serif;
  padding:10px;
  margin:0;
  background:#f0fff4;
}

h2{
  color:#0a7f3f;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:2px solid #0a7f3f;
  border-radius:8px;
}

.card{
  background:#fff;
  border-left:5px solid #0a7f3f;
  padding:12px;
  margin:12px 0;
  border-radius:10px;
}

.noteItem{
  font-size:14px;
  margin-left:8px;
}

button{
  background:#0a7f3f;
  color:white;
  border:none;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  width:100%;
}

.btnGroup{
  display:flex;
  flex-direction:column;
}

.codeBox{
  display:none;
  background:#001a0d;
  color:#00ff88;
  padding:10px;
  border-radius:6px;

  white-space:pre-wrap;
  word-break:break-word;
}

@media(min-width:600px){
  .btnGroup{flex-direction:row;}
  button{width:auto;}
}

</style>

</head>

<body>

<h2>🌿 Notes Viewer</h2>

<input id="search" placeholder="Search topic...">

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEwS76zKIM5fW7SrsUygNoZCRCDS5gH-Q",
  authDomain: "ai-html-63caa.firebaseapp.com",
  projectId: "ai-html-63caa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id=>document.getElementById(id);

let dataArr=[];

/* 🔴 DATA */
onSnapshot(collection(db,"notes"),snap=>{
  dataArr=[];
  snap.forEach(d=>{
    dataArr.push({id:d.id,...d.data()});
  });
  render(dataArr);
});

/* 🔥 RENDER */
function render(arr){

let html="";

arr.forEach((x,i)=>{

html+=`
<div class="card">

<b>${i+1}. ${x.topic || ""}</b>

${(x.notes || []).map(n=>`<div class="noteItem">• ${n}</div>`).join("")}

<div class="btnGroup">
<button onclick="toggleCode('${x.id}')">👁 Show Code</button>
<button onclick="copyCode(\`${escapeHTML(x.code || "")}\`)">📋 Copy</button>
</div>

<pre id="code-${x.id}" class="codeBox">${escapeHTML(x.code || "")}</pre>

</div>
`;

});

$("list").innerHTML=html;
}

/* 👁 */
window.toggleCode=id=>{
let el=document.getElementById("code-"+id);
el.style.display = el.style.display==="block" ? "none":"block";
};

/* 📋 */
window.copyCode=code=>{
navigator.clipboard.writeText(code);
alert("Copied!");
};

/* 🔍 SEARCH */
$("search").addEventListener("input",()=>{
let val=$("search").value.toLowerCase();
render(dataArr.filter(x=>(x.topic||"").toLowerCase().includes(val)));
});

/* 🚀 DOUBLE CLICK REDIRECT */
$("search").addEventListener("dblclick",()=>{
  window.location.href="page2.html";
});

/* 🛡 */
function escapeHTML(str){
return str.replace(/[&<>"']/g,t=>{
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t];
});
}

/* 🔥 SERVICE WORKER */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
