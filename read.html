<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Viewer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 15px;
}

.search {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
}

.topic {
    background: #1e293b;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
    cursor: pointer;
}

.modal {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}

.box {
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:90%;
}

button {
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}

.copy { background:#3b82f6; }
.close { background:#ef4444; }
</style>

</head>
<body>

<h2>📘 Topics</h2>

<input class="search" id="search" placeholder="Search topic...">

<div id="list"></div>

<div class="modal" id="modal">
    <div class="box">
        <div id="note"></div>
        <button class="copy" onclick="copy()">Copy Code</button>
        <button class="close" onclick="closeBox()">Close</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEwS76zKIM5fW7SrsUygNoZCRCDS5gH-Q",
  authDomain: "ai-html-63caa.firebaseapp.com",
  projectId: "ai-html-63caa",
  storageBucket: "ai-html-63caa.firebasestorage.app",
  messagingSenderId: "382279036183",
  appId: "1:382279036183:web:9c9a46129ba1cbd32f1b52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allData = [];
let currentCode = "";

// Load Data
async function load() {
    const querySnapshot = await getDocs(collection(db, "topics"));
    allData = [];

    querySnapshot.forEach(doc => {
        allData.push(doc.data());
    });

    render();
}

// Render
function render() {
    let search = document.getElementById("search").value.toLowerCase();
    let list = document.getElementById("list");
    list.innerHTML = "";

    allData.forEach((item, index) => {
        if (item.title.toLowerCase().includes(search)) {
            let div = document.createElement("div");
            div.className = "topic";
            div.innerText = (index+1) + ". " + item.title;

            div.onclick = () => open(item);

            list.appendChild(div);
        }
    });
}

// Open Topic
function open(item) {
    document.getElementById("note").innerText = item.note;
    currentCode = item.code;
    document.getElementById("modal").style.display = "flex";
}

// Copy
window.copy = () => {
    navigator.clipboard.writeText(currentCode);
    alert("Code Copied!");
}

// Close
window.closeBox = () => {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("search").addEventListener("input", render);

load();

</script>

</body>
</html>
