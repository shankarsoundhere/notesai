<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Add Topic</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 15px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
}

textarea { height: 80px; }

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #22c55e;
    border: none;
    border-radius: 6px;
}
</style>

</head>
<body>

<h2>✍️ Add Topic</h2>

<input id="title" placeholder="Topic Name">
<textarea id="note" placeholder="Notes..."></textarea>
<textarea id="code" placeholder="Full Code (hidden)"></textarea>

<button onclick="save()">Save to Firebase</button>

<script type="module">

// 🔥 Firebase Config (अपना डालना)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEwS76zKIM5fW7SrsUygNoZCRCDS5gH-Q",
  authDomain: "ai-html-63caa.firebaseapp.com",
  projectId: "ai-html-63caa",
  storageBucket: "ai-html-63caa.firebasestorage.app",
  messagingSenderId: "382279036183",
  appId: "1:382279036183:web:9c9a46129ba1cbd32f1b52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.save = async () => {
    let title = document.getElementById("title").value;
    let note = document.getElementById("note").value;
    let code = document.getElementById("code").value;

    if (!title || !note || !code) {
        alert("Fill all fields!");
        return;
    }

    await addDoc(collection(db, "topics"), {
        title, note, code,
        time: Date.now()
    });

    alert("Saved!");

    document.getElementById("title").value = "";
    document.getElementById("note").value = "";
    document.getElementById("code").value = "";
};

</script>

</body>
</html>
